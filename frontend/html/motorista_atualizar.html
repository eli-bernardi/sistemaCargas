<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Motorista - Logística Express</title>
    <script src="../js/motorista_atualizar.js" defer></script>
</head>

<body>
    <header>
        <nav aria-label="Navegação principal">
            <a href="../index.html">Home</a>&emsp;
            <span>Funcionário: <strong id="funcionario"></strong></span>&emsp;
            <a href="#" id="btn_logout">Logout</a>
            <br><br>
            <b>Motorista:</b>
            <a href="../html/motorista_cadastrar.html">Cadastrar</a>
            <a href="../html/motorista_listar.html">Listar</a>
            <a href="../html/motorista_buscar.html">Buscar por nome</a>
            <a href="../html/motorista_atualizar.html">Atualizar</a>
            <a href="../html/motorista_apagar.html">Excluir</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Atualizar Motorista</h1>
        <form>
            <label for="codMotorista">Código do motorista</label><br>
            <input type="number" id="codMotorista" required><br><br>

            <label for="nome">Nome</label><br>
            <input type="text" id="nome" required><br><br>

            <label for="cnh">CNH (11 dígitos)</label><br>
            <input type="text" id="cnh" required><br><br>

            <label for="cpf">CPF (11 dígitos)</label><br>
            <input type="text" id="cpf" required><br><br>

            <label for="telefone">Telefone</label><br>
            <input type="text" id="telefone" required><br><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <div id="resposta"></div>
    </main>
</body>

</html>
