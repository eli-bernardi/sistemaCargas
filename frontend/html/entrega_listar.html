<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Entregas - Logística Express</title>
    <script src="../js/menu.js" defer></script>
    <script src="../js/entrega_listar.js" defer></script>
</head>

<body>

    <header>
        <nav aria-label="Navegação principal">
            <a href="../index.html">Home</a>&emsp;
            <span>Funcionário: <strong id="funcionario"></strong></span>&emsp;
            <a href="#" id="btn_logout">Logout</a>
            <br><br>
            <b>Entrega:</b>
            <a href="../html/entrega_cadastrar.html">Cadastrar</a>
            <a href="../html/entrega_atualizar.html">Atualizar status</a>
            <a href="../html/entrega_listar.html">Listar</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Listar Entregas</h1>
        <form>
            <label for="ordem">Ordenar por data</label>
            <select id="ordem">
                <option value="asc">Mais antigas primeiro</option>
                <option value="desc">Mais recentes primeiro</option>
            </select>

            <label for="filtro_status">Status</label>
            <select id="filtro_status">
                <option value="">Todos</option>
                <option value="TRANSITO">TRANSITO</option>
                <option value="ENTREGUE">ENTREGUE</option>
            </select>

            <button id="btn_listar">Listar</button>
        </form>
        <br>
        <div id="lista"></div>
        <div id="resposta"></div>
    </main>
</body>

</html>
