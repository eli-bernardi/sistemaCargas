<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Carga - Logística Express</title>
    <script src="../js/menu.js" defer></script>
    <script src="../js/carga_cadastrar.js" defer></script>
</head>
<body>
    <header>
        <nav aria-label="Navegação principal">
            <a href="../index.html">Home</a>&emsp;
            <span>Funcionário: <strong id="funcionario"></strong></span>&emsp;
            <a href="#" id="btn_logout">Logout</a>
            <br><br>
            <b>Motorista:</b>
            <a href="../html/motorista_cadastrar.html">Cadastrar</a>
            <a href="../html/motorista_listar.html">Listar</a>
            <a href="../html/motorista_buscar.html">Buscar por nome</a>
            <a href="../html/motorista_atualizar.html">Atualizar</a>
            <a href="../html/motorista_apagar.html">Excluir</a>
            <br>
            <b>Carga:</b>
            <a href="../html/carga_cadastrar.html">Cadastrar</a>
            <a href="../html/carga_listar.html">Listar</a>
            <br>
            <b>Entrega:</b>
            <a href="../html/entrega_cadastrar.html">Cadastrar</a>
            <a href="../html/entrega_atualizar.html">Atualizar status</a>
            <a href="../html/entrega_listar.html">Listar</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Cadastrar Carga</h1>
        <form>
            <label for="descricao">Descrição</label><br>
            <input type="text" id="descricao" required><br><br>
            <label for="peso">Peso (kg)</label><br>
            <input type="number" step="0.01" min="0.01" id="peso" required><br><br>
            <label for="volume">Volume (m³)</label><br>
            <input type="number" step="0.01" min="0.01" id="volume" required><br><br>
            <label for="codigoRastreio">Código de rastreio (numérico)</label><br>
            <input type="number" min="1" id="codigoRastreio" required><br><br>
            <label for="idMotorista">Motorista</label><br>
            <select id="idMotorista" required></select><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta"></div>
    </main>
</body>
</html>
