<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Entrega - Logística Express</title>
    <script src="../js/menu.js" defer></script>
    <script src="../js/entrega_cadastrar.js" defer></script>
</head>

<body>

    <header>
        <nav aria-label="Navegação principal">
            <a href="../index.html">Home</a>&emsp;
            <span>Funcionário: <strong id="funcionario"></strong></span>&emsp;
            <a href="#" id="btn_logout">Logout</a>
            <br><br>
            <b>Entrega:</b>
            <a href="../html/entrega_cadastrar.html">Cadastrar</a>
            <a href="../html/entrega_atualizar.html">Atualizar status</a>
            <a href="../html/entrega_listar.html">Listar</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Cadastrar Entrega</h1>
        <form>
            <label for="idCarga">Carga</label><br>
            <select id="idCarga" required></select><br><br>

            <label for="cidadeDestino">Cidade destino</label><br>
            <input type="text" id="cidadeDestino" required><br><br>
            <label for="status">Status</label><br>
            <select id="status" required>
                <option value="TRANSITO">TRANSITO</option>
                <option value="ENTREGUE">ENTREGUE</option>
            </select><br><br>
            <label for="data">Data:</label><br>
            <input type="data" id="data" required><br><br>
            <label for="hora">Hora:</label><br>
            <input type="hora" id="hora" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta"></div>
    </main>
</body>

</html>
